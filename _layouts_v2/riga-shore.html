<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --sand: #f5f0e8;
  --sand-dark: #e8e0d0;
  --bark: #3a2f28;
  --bark-light: #5c4a3e;
  --moss: #4A5D3A;
  --moss-light: #5E7648;
  --moss-pale: #E3E9D9;
  --amber: #B8862E;
  --amber-light: #D4A547;
  --cream: #fffcf5;
  --clay: #b8705a;
  --white: #ffffff;
  --focus: #3b82f6;
  /* ── Latvian heritage palette (Phase 2 — folk costume) ─────────
     Carmine    — Pantone 201 C, the flag and Lielvārdes josta.
     Indigo     — the dark blue wool that dominated the
                  archaeological Baltic costume (7th–13th c.) and
                  the Latgale shawl embroidery.
     Forest     — the deep olive-green of Vidzeme skirt plaids,
                  already mapped onto --moss above.
     Flax-gold  — the muted honey of undyed linseed oil and the
                  yellow glass paste beads of Vend/Liv tribes,
                  already mapped onto --amber above.
     Linen      — undyed flax, the backbone of every costume.
     Peat       — the dark bog earth, for headings.
     Bronze     — the archaeological jewelry metal, for hairlines
                  and decorative marks.                            */
  --carmine: #9E1B32;
  --carmine-dark: #7A1426;
  --indigo: #253961;
  --indigo-dark: #1A2A48;
  --linen: #FBF7EE;
  --peat: #2B1F1A;
  --bronze: #8C6D2E;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;
  --space-16: 4rem;
  --space-20: 5rem;
  --space-24: 6rem;
  --font-body: 'Source Sans 3', system-ui, -apple-system, sans-serif;
  --font-display: 'Source Sans 3', system-ui, -apple-system, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

/* ── LIELVĀRDES JOSTA STRIP ─────────────────────────────────────
   A tileable SVG band inspired by the Lielvārde woven folk belt —
   the single most iconic Latvian visual element. Used as a maker's
   mark at the foot of the page.                                    */
.josta-strip{
  height:22px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='22' viewBox='0 0 64 22'><rect width='64' height='22' fill='%239E1B32'/><line x1='0' y1='3' x2='64' y2='3' stroke='%23FBF7EE' stroke-width='0.6'/><line x1='0' y1='19' x2='64' y2='19' stroke='%23FBF7EE' stroke-width='0.6'/><g fill='none' stroke='%23FBF7EE' stroke-width='1.1' stroke-linejoin='miter'><path d='M32 6.5L37.5 11L32 15.5L26.5 11Z'/></g><g fill='%23FBF7EE'><circle cx='32' cy='11' r='1.1'/><rect x='7' y='10.25' width='1.5' height='1.5' transform='rotate(45 7.75 11)'/><rect x='56' y='10.25' width='1.5' height='1.5' transform='rotate(45 56.75 11)'/><rect x='18' y='10.5' width='1' height='1'/><rect x='46' y='10.5' width='1' height='1'/></g></svg>");
  background-repeat:repeat-x;
  background-size:64px 22px;
}

/* ── ACCESSIBILITY ── */
.skip-link{
  position:absolute;top:-100%;left:1rem;z-index:9999;
  background:var(--bark);color:var(--white);
  padding:var(--space-3) var(--space-6);border-radius:0 0 8px 8px;
  font-weight:600;font-size:.9rem;
  text-decoration:none;
  transition:top .2s;
}
.skip-link:focus{top:0}

*:focus-visible{
  outline:3px solid var(--focus);
  outline-offset:2px;
  border-radius:4px;
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}

/* ── BASE ── */
html{scroll-behavior:smooth;font-size:16px}
body{
  font-family:var(--font-body);
  color:var(--bark);
  background:var(--linen);
  font-size:16px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;line-height:1.2;color:var(--peat);letter-spacing:-0.01em}
a{color:var(--indigo);text-decoration:none;transition:color .2s}
a:hover{color:var(--carmine)}
img{max-width:100%;display:block;height:auto}

/* ── NAV (inner page — solid background) ── */
.nav{position:sticky;top:0;z-index:100;background:var(--linen);border-bottom:3px solid var(--carmine)}
.nav-inner{
  max-width:1100px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--space-3) var(--space-8);
}
.nav-logo{display:flex;align-items:center;gap:var(--space-4);text-decoration:none;height:56px}
.nav-logo img{height:48px;width:auto}
.nav-logo-stamp{
  display:flex;flex-direction:column;
  padding-left:.9rem;
  border-left:2px solid var(--bronze);
  line-height:1;
}
.nav-logo-stamp-top{
  font-size:.65rem;font-weight:800;letter-spacing:.16em;
  color:var(--carmine);text-transform:uppercase;
  font-family:var(--font-display);font-weight:400;
  font-style:normal;
}
.nav-logo-stamp-bot{
  font-size:.58rem;font-weight:700;letter-spacing:.22em;
  color:var(--indigo);text-transform:uppercase;
  margin-top:4px;
}
@media(max-width:640px){.nav-logo-stamp{display:none}}
/* Nav locale-robustness — Lesson 16. */
.nav-logo{flex-shrink:0}
.nav-logo-stamp-top,.nav-logo-stamp-bot{white-space:nowrap}
.nav .nav-links a{white-space:nowrap}
.nav-links{display:flex;gap:var(--space-8);list-style:none;align-items:center}
.nav-links a{font-size:.875rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--bark-light);text-decoration:none;transition:color .2s}
.nav-links a:hover{color:var(--carmine)}
.nav-cta{background:var(--indigo)!important;color:#fff!important;padding:.55rem 1.3rem;border-radius:6px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;font-size:.875rem}.nav-links a[aria-current="page"]{color:var(--peat)!important;font-weight:700;border-bottom:2px solid var(--carmine)!important}
.nav-cta:hover{background:var(--indigo-dark)!important;color:#fff!important}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:4px}
.hamburger span{display:block;width:24px;height:2px;background:var(--bark);border-radius:2px;transition:all .3s}

/* ── NAV COLLAPSE — see Lesson 16 ── */
@media(max-width:1100px){
  .nav-links{display:none}
  .hamburger{display:flex}
  .nav-links.open{
    display:flex;flex-direction:column;
    position:absolute;top:100%;left:0;right:0;
    background:var(--cream);
    border-bottom:1px solid var(--sand-dark);
    padding:var(--space-4) var(--space-8);gap:var(--space-4);
    box-shadow:0 8px 24px rgba(58,47,40,.1);
  }
}

/* ── BREADCRUMBS ── */
.breadcrumbs{
  max-width:1100px;margin:0 auto;
  padding:var(--space-4) var(--space-8) var(--space-2);
  font-size:.8rem;
}
.breadcrumbs ol{list-style:none;display:flex;flex-wrap:wrap;gap:var(--space-1);align-items:center}
.breadcrumbs li{display:flex;align-items:center;gap:var(--space-1);color:var(--bark-light)}
.breadcrumbs a{color:var(--moss);text-decoration:none}
.breadcrumbs a:hover{text-decoration:underline}
.breadcrumbs .sep{color:var(--sand-dark);margin:0 .15rem}

/* ── PAGE HERO ── */
.page-hero{
  position:relative;
  height:520px;
  overflow:hidden;
}
@media(max-width:768px){
  .page-hero{height:380px}
}
/* Multi-slide hero with Ken Burns */
.hero-slides{position:absolute;inset:0}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 2s ease-in-out}
.hero-slide.active{opacity:1}
.hero-slide img{
  width:100%;height:100%;
  object-fit:cover;
  /* `center 30%` favours the upper portion of the photo so heads in
     people-photos aren't cropped. Was `center 60%` previously, which
     cut the top 35% of every photo. Per-slide override available via
     `slide_N_style: "object-position: ..."` in the MD frontmatter for
     photos that need a different anchor (e.g. food close-ups, low
     skylines). */
  object-position:center 30%;
  will-change:transform;
}
/* Ken Burns: default applied to active slide; JS cycles through variants */
.hero-slide img{
  animation:kb-zoom-centre 14s linear forwards;
}
@keyframes kb-drift-right{
  from{transform:scale(1) translateX(-1.5%)}
  to{transform:scale(1.1) translateX(1.5%)}
}
@keyframes kb-drift-left{
  from{transform:scale(1) translateX(1.5%)}
  to{transform:scale(1.1) translateX(-1.5%)}
}
@keyframes kb-zoom-centre{
  from{transform:scale(1)}
  to{transform:scale(1.1)}
}
@keyframes kb-drift-up{
  from{transform:scale(1.05) translateY(1.5%)}
  to{transform:scale(1.12) translateY(-1.5%)}
}
@keyframes kb-drift-down{
  from{transform:scale(1.05) translateY(-1.5%)}
  to{transform:scale(1.12) translateY(1.5%)}
}
/* Photo attribution */
.photo-credit{
  position:absolute;bottom:8px;right:12px;
  font-size:.65rem;color:rgba(255,255,255,.72);
  font-style:italic;pointer-events:none;
  text-shadow:0 1px 3px rgba(0,0,0,.7);
  z-index:4;
  letter-spacing:.01em;
  transition:opacity .6s ease-in-out;
}
/* ── SAULE WATERMARK (hero ambient symbol) ──────────────────────
   A traditional Latvian 8-ray sun disc, sitting at low opacity
   over the hero photography. Thematic for an early-morning tour.
   Hidden on mobile to avoid crowding.                            */
.hero-saule{
  position:absolute;
  top:70px;left:56px;
  width:260px;height:260px;
  z-index:2;
  pointer-events:none;
  opacity:.14;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='none' stroke='%23FBF7EE' stroke-width='2.5' stroke-linecap='round'><circle cx='50' cy='50' r='15'/><circle cx='50' cy='50' r='5' fill='%23FBF7EE'/><line x1='50' y1='22' x2='50' y2='9'/><line x1='50' y1='78' x2='50' y2='91'/><line x1='22' y1='50' x2='9' y2='50'/><line x1='78' y1='50' x2='91' y2='50'/><line x1='30.5' y1='30.5' x2='21' y2='21'/><line x1='69.5' y1='69.5' x2='79' y2='79'/><line x1='30.5' y1='69.5' x2='21' y2='79'/><line x1='69.5' y1='30.5' x2='79' y2='21'/></g></svg>");
  background-size:contain;
  background-repeat:no-repeat;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.15));
}
@media(max-width:900px){
  .hero-saule{width:180px;height:180px;top:40px;left:24px;opacity:.11}
}
@media(max-width:640px){
  .hero-saule{display:none}
}
.page-hero-overlay{
  position:absolute;inset:0;
  background:linear-gradient(rgba(58,47,40,.08) 0%,rgba(58,47,40,.55) 100%);
  z-index:1;
  pointer-events:none;
}
/* Hero CTA — bottom-left "Check availability" button */
.hero-cta{
  position:relative;
  display:inline-flex;align-items:center;gap:var(--space-2);
  margin-top:1.1rem;
  padding:var(--space-3) 1.3rem;
  background:var(--amber,#B8862E);
  color:#fff;
  font-size:.92rem;font-weight:700;letter-spacing:.02em;
  text-decoration:none;
  border-radius:8px;
  box-shadow:0 4px 14px rgba(0,0,0,.25),0 1px 3px rgba(0,0,0,.2);
  transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
  backdrop-filter:blur(2px);
  overflow:hidden;
  z-index:1;
}
.hero-cta::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 0%,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%,transparent 100%);
  transform:translateX(-120%);
  animation:hero-cta-shimmer 3.2s ease-in-out infinite;
  animation-delay:1.2s;
  pointer-events:none;
}
@keyframes hero-cta-shimmer{
  0%{transform:translateX(-120%)}
  55%,100%{transform:translateX(120%)}
}
.hero-cta:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(0,0,0,.3),0 2px 4px rgba(0,0,0,.2);
  background:#d19f45;
  color:#fff;
}
.hero-cta > *{position:relative;z-index:1}
.hero-cta svg{width:14px;height:14px;transition:transform .18s ease}
.hero-cta:hover svg{transform:translateX(3px)}
@media(max-width:640px){
  .hero-cta{padding:.65rem 1.1rem;font-size:.85rem;margin-top:.85rem}
}
/* ── HERO TRUST BANNER ── */
.hero-trust-bar{
  position:sticky;
  top:72px;
  z-index:99;
  display:flex;align-items:center;justify-content:center;
  gap:var(--space-6);
  padding:var(--space-2) var(--space-6);
  background:var(--carmine);
  overflow:hidden;
  box-shadow:0 2px 10px rgba(158,27,50,.3);
  border-top:1px solid rgba(255,255,255,.12);
  border-bottom:1px solid rgba(0,0,0,.18);
}
.hero-trust-bar::after{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 0%,rgba(255,255,255,.08) 50%,transparent 100%);
  transform:translateX(-100%);
  animation:hero-shimmer 4s ease-in-out infinite;
  animation-delay:2s;
}
@keyframes hero-shimmer{
  0%{transform:translateX(-100%)}
  50%,100%{transform:translateX(100%)}
}
.htb-main{
  display:flex;align-items:center;gap:.45rem;
  font-size:.88rem;font-weight:800;
  color:#fff;
  letter-spacing:.04em;
  white-space:nowrap;
  text-shadow:0 1px 2px rgba(0,0,0,.15);
}
.htb-main svg{flex-shrink:0;color:#fff}
.htb-divider{
  width:1px;height:14px;
  background:rgba(255,255,255,.3);
  flex-shrink:0;
}
.htb-detail{
  display:flex;align-items:center;gap:.3rem;
  font-size:.75rem;color:rgba(255,255,255,.92);
  white-space:nowrap;
}
.htb-detail svg{flex-shrink:0;opacity:.8}
@media(max-width:640px){
  .hero-trust-bar{gap:var(--space-3);padding:.55rem var(--space-4);flex-wrap:wrap;justify-content:flex-start}
  .htb-divider{display:none}
  .htb-detail:nth-child(n+4){display:none}
}
.page-hero-content{
  position:absolute;bottom:0;left:0;right:0;
  max-width:1100px;margin:0 auto;
  padding:var(--space-8);
  z-index:2;
}
/* ── HERO CREDENTIALS (right side) ── */
.hero-creds{
  position:absolute;
  top:50%;right:2rem;
  transform:translateY(-50%);
  z-index:2;
  display:flex;flex-direction:column;gap:.55rem;
  max-width:210px;
  pointer-events:none;
}
.hero-cred{
  display:flex;align-items:flex-start;gap:.55rem;
  padding:.55rem var(--space-3);
  background:rgba(20,16,12,.55);
  border:1px solid rgba(255,255,255,.18);
  border-left:3px solid var(--amber-light,#d9a84a);
  border-radius:6px;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  box-shadow:0 2px 10px rgba(0,0,0,.25);
  animation:cred-fade-in .6s ease-out both;
}
.hero-cred:nth-child(1){animation-delay:.3s}
.hero-cred:nth-child(2){animation-delay:.55s}
.hero-cred:nth-child(3){animation-delay:.8s}
.hero-cred:nth-child(4){animation-delay:1.05s}
@keyframes cred-fade-in{
  from{opacity:0;transform:translateX(12px)}
  to{opacity:1;transform:translateX(0)}
}
.hero-cred svg{
  flex-shrink:0;width:16px;height:16px;
  color:var(--amber-light,#e6b659);
  margin-top:1px;
}
.hero-cred-text{
  font-size:.7rem;line-height:1.3;
  color:rgba(255,255,255,.92);
  letter-spacing:.01em;
}
.hero-cred-text strong{
  display:block;
  font-size:.72rem;
  font-weight:800;
  color:#fff;
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:1px;
}
@media(max-width:1024px){
  .hero-creds{right:1rem;max-width:180px;gap:.45rem}
  .hero-cred{padding:var(--space-2) .65rem}
  .hero-cred-text{font-size:.66rem}
  .hero-cred-text strong{font-size:.68rem}
}
@media(max-width:768px){
  .hero-creds{display:none}
}
.feeling-label{
  display:inline-block;
  font-size:.65rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:#fff;
  background:var(--carmine);
  border:1px solid rgba(255,255,255,.35);
  padding:.35rem var(--space-4);border-radius:20px;
  margin-bottom:var(--space-3);
  box-shadow:0 2px 8px rgba(158,27,50,.35);
}
.page-hero h1{
  font-size:clamp(1.8rem,4vw,2.6rem);
  color:var(--white);
  max-width:700px;
  line-height:1.15;
  text-shadow:0 2px 8px rgba(0,0,0,.2);
}
.page-hero .hero-sub{
  font-size:1rem;color:rgba(255,255,255,.8);
  max-width:600px;margin-top:var(--space-3);line-height:1.6;
}

/* ── MAIN CONTENT ── */
.page-body{max-width:1100px;margin:0 auto;padding:var(--space-10) var(--space-8) var(--space-16)}

/* ── QUICK FACTS ── */
.quick-facts{
  display:flex;flex-wrap:wrap;gap:0;
  border:1px solid var(--sand-dark);
  border-radius:12px;
  overflow:hidden;
  margin-bottom:var(--space-12);
  background:var(--white);
}
.qf{
  flex:1 1 auto;
  padding:.85rem var(--space-5);
  display:flex;align-items:center;gap:.6rem;
  font-size:.85rem;color:var(--bark);
  border-right:1px solid var(--sand);
  min-width:150px;
}
.qf:last-child{border-right:none}
.qf svg{flex-shrink:0;width:20px;height:20px;color:var(--indigo)}
.qf strong{font-weight:600;display:block;font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;color:var(--bark-light)}

/* ── TWO COLUMN LAYOUT ── */
.content-grid{
  display:grid;
  grid-template-columns:1fr 340px;
  gap:var(--space-12);
  align-items:start;
}
.content-main{}
.content-sidebar{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow-y:auto;padding-right:2px}

/* ── SECTION HEADINGS ── */
.section-label{
  font-size:.7rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--moss);margin-bottom:var(--space-2);
}
.content-main h2{
  font-size:1.6rem;margin-bottom:var(--space-4);margin-top:2.75rem;
  padding-left:0;
  border-left:none;
  line-height:1.25;
  display:flex;align-items:center;gap:.85rem;
}
.content-main h2::before{
  content:'';
  display:inline-block;
  flex-shrink:0;
  width:26px;height:26px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239E1B32'><path d='M12 1.5L13.6 9.2L21.5 10L14.9 13.2L16.5 21L12 15.8L7.5 21L9.1 13.2L2.5 10L10.4 9.2Z'/><circle cx='12' cy='12' r='1.2' fill='%23FBF7EE'/></svg>");
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center;
  filter:drop-shadow(0 1px 1px rgba(158,27,50,.2));
}
.content-main h2:first-child{margin-top:0}
.content-main h3{
  font-size:1.15rem;margin:1.75rem 0 var(--space-3);color:var(--moss);
  padding-left:var(--space-3);
  border-left:2px solid var(--indigo);
}
.content-main p{
  color:var(--bark-light);font-size:.95rem;line-height:1.75;margin-bottom:var(--space-4);
}
.content-main p strong,
.content-main li strong{color:var(--peat);font-weight:700}

/* ── HIGHLIGHTS ── */
/* Two-column packing via CSS columns (not grid) so short bullets sit
   tight against the next one regardless of how tall the bullet next to
   them is. Earlier grid layout forced row-height to the taller cell and
   left ugly trailing whitespace under shorter cells. */
.highlights{
  column-count:2;column-gap:var(--space-6);
  margin:var(--space-5) 0 var(--space-8);
}
.highlight{
  display:flex;align-items:flex-start;gap:var(--space-2);
  font-size:.9rem;color:var(--bark);
  break-inside:avoid;margin-bottom:.55rem;
}
.highlight svg{flex-shrink:0;width:18px;height:18px;color:var(--moss);margin-top:3px}

/* ── SPECIALIST INSIGHT ── */
.specialist-insight{
  background:var(--sand);
  border-radius:14px;
  padding:var(--space-8);
  margin:var(--space-10) 0;
  display:grid;
  grid-template-columns:72px 1fr;
  gap:var(--space-6);
  align-items:start;
}
.specialist-photo{
  width:72px;height:72px;border-radius:50%;
  overflow:hidden;border:2px solid var(--white);
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}
.specialist-photo img{width:100%;height:100%;object-fit:cover}
.specialist-body h3{
  font-size:1.1rem;margin:0 0 var(--space-1);color:var(--bark);
}
.specialist-body .subtitle{
  font-size:.8rem;color:var(--moss);font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;
  margin-bottom:var(--space-4);
}
.insight-item{margin-bottom:var(--space-5)}
.insight-item:last-child{margin-bottom:0}
.insight-item h4{
  font-family:var(--font-body);
  font-size:.82rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--moss);margin-bottom:.3rem;
}
.insight-item p{font-size:.88rem;color:var(--bark-light);line-height:1.65;margin:0}

/* ── ITINERARY ── */
.itin-stop{
  display:grid;grid-template-columns:48px 1fr;gap:var(--space-4);
  margin-bottom:var(--space-6);position:relative;
}
.itin-stop::before{
  content:'';position:absolute;left:23px;top:44px;bottom:-12px;
  width:2px;background:var(--sand-dark);
}
.itin-stop:last-child::before{display:none}
.itin-num{
  width:48px;height:48px;border-radius:50%;
  background:var(--moss-pale);color:var(--moss);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:1.1rem;
  position:relative;z-index:1;
}
.itin-body h3{font-size:1rem;margin-bottom:.3rem;font-family:var(--font-display)}
.itin-body p{font-size:.9rem;color:var(--bark-light);line-height:1.7;margin:0}

/* ── INCLUDES GRID ── */
.inc-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-8);margin:var(--space-4) 0 var(--space-8)}
.inc-col h4{
  font-family:var(--font-body);
  font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  margin-bottom:var(--space-3);
}
.inc-col.yes h4{color:var(--moss)}
.inc-col.no h4{color:var(--clay)}
.inc-item{display:flex;align-items:flex-start;gap:var(--space-2);font-size:.9rem;color:var(--bark-light);margin-bottom:var(--space-2)}
.inc-item svg{flex-shrink:0;width:16px;height:16px;margin-top:3px}
.inc-col.yes .inc-item svg{color:var(--moss)}
.inc-col.no .inc-item svg{color:var(--clay)}

/* ── GOOD TO KNOW ── */
.gtk-item{margin-bottom:var(--space-5)}
.gtk-item h3{
  font-family:var(--font-body);
  font-size:.88rem;font-weight:600;color:var(--bark);margin-bottom:.3rem;
}
.gtk-item p{font-size:.88rem;color:var(--bark-light);line-height:1.7;margin:0}

/* ── PHOTO GALLERY ── */
.gallery-grid{
  display:grid;
  grid-template-columns:3fr 1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:4px;
  border-radius:12px;
  overflow:hidden;
  margin:var(--space-8) 0;
  min-height:300px;
  cursor:pointer;
}
.gallery-grid .g-img{overflow:hidden;position:relative}
.gallery-grid .g-img:first-child{grid-row:1/3}
.gallery-grid .g-img img{
  width:100%;height:100%;object-fit:cover;display:block;
  will-change:transform;
}
.gallery-grid .g-img:nth-child(1) img{animation:kb-g1 14s linear infinite alternate;transform-origin:center}
.gallery-grid .g-img:nth-child(2) img{animation:kb-g2 11s linear infinite alternate;transform-origin:top right}
.gallery-grid .g-img:nth-child(3) img{animation:kb-g3 13s linear infinite alternate;transform-origin:bottom left}
.gallery-grid .g-img:nth-child(4) img{animation:kb-g4 12s linear infinite alternate;transform-origin:top left}
.gallery-grid .g-img:nth-child(5) img{animation:kb-g1 15s linear infinite alternate;transform-origin:bottom right}
@keyframes kb-g1{from{transform:scale3d(1,1,1) translate3d(0,0,0)}to{transform:scale3d(1.12,1.12,1) translate3d(-2%,-1%,0)}}
@keyframes kb-g2{from{transform:scale3d(1.1,1.1,1) translate3d(1%,0,0)}to{transform:scale3d(1,1,1) translate3d(0,0,0)}}
@keyframes kb-g3{from{transform:scale3d(1,1,1) translate3d(0,0,0)}to{transform:scale3d(1.1,1.1,1) translate3d(1%,-2%,0)}}
@keyframes kb-g4{from{transform:scale3d(1.08,1.08,1) translate3d(-1%,1%,0)}to{transform:scale3d(1,1,1) translate3d(0,0,0)}}
.gallery-more{
  position:relative;cursor:pointer;
}
.gallery-more-overlay{
  position:absolute;inset:0;
  background:rgba(58,47,40,.6);
  display:flex;align-items:center;justify-content:center;
  color:var(--white);font-size:.85rem;font-weight:600;
  gap:.4rem;
  transition:background .2s;
}
.gallery-more:hover .gallery-more-overlay{background:rgba(58,47,40,.75)}
.gallery-more-overlay svg{width:16px;height:16px}

/* ── LIGHTBOX ── */
.lightbox{
  display:none;position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.96);
  flex-direction:column;
}
.lightbox.open{display:flex}
.lb-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--space-3) var(--space-6);color:white;flex-shrink:0;
}
.lb-counter{font-size:.9rem;opacity:.7}
.lb-close{
  background:none;border:none;color:white;cursor:pointer;
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;transition:background .2s;
}
.lb-close:hover{background:rgba(255,255,255,.15)}
.lb-close svg{width:28px;height:28px}
.lb-body{
  flex:1;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;padding:0 60px;min-height:0;
}
.lb-body picture{display:contents}
.lb-img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;transition:opacity .3s}
.lb-caption{
  text-align:center;padding:var(--space-3) var(--space-6);
  color:rgba(255,255,255,.6);font-size:.85rem;flex-shrink:0;
}
.lb-credit{text-align:center;font-size:.72rem;color:rgba(255,255,255,.55);font-style:italic;letter-spacing:.02em;padding:var(--space-1) var(--space-4) var(--space-2);line-height:1.4}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:48px;height:48px;border-radius:50%;
  background:rgba(255,255,255,.15);border:none;
  color:white;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s;z-index:2;
}
.lb-nav:hover{background:rgba(255,255,255,.3)}
.lb-nav svg{width:24px;height:24px}
.lb-nav.prev{left:12px}
.lb-nav.next{right:12px}
.lb-thumbs{
  display:flex;gap:4px;padding:8px var(--space-6);
  overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:0;
}
.lb-thumb{
  width:56px;height:42px;border-radius:4px;
  overflow:hidden;cursor:pointer;
  opacity:.4;transition:opacity .2s;
  flex-shrink:0;border:2px solid transparent;
}
.lb-thumb.active{opacity:1;border-color:white}
.lb-thumb img{width:100%;height:100%;object-fit:cover}
@media(max-width:768px){
  .lb-body{padding:0 44px}
  .lb-nav{width:36px;height:36px}
  .lb-thumbs{display:none}
}

/* ── FAQ ── */
.faq-list{margin:var(--space-4) 0 var(--space-8)}
.faq-item{
  border-bottom:1px solid var(--sand-dark);
}
.faq-item:first-child{border-top:1px solid var(--sand-dark)}
.faq-q{
  display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);
  padding:var(--space-4) 0;
  cursor:pointer;
  background:none;border:none;
  width:100%;text-align:left;
  font-family:var(--font-body);
  font-size:.95rem;font-weight:600;color:var(--bark);
  line-height:1.4;
}
.faq-q svg{flex-shrink:0;width:20px;height:20px;color:var(--moss);transition:transform .2s}
.faq-q[aria-expanded="true"] svg{transform:rotate(180deg)}
.faq-q:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.faq-a{
  display:none;
  padding:0 0 var(--space-4);
}
.faq-a[aria-hidden="false"]{display:block}
.faq-a p{font-size:.9rem;color:var(--bark-light);line-height:1.7;margin:0}

/* ── SIDEBAR BOOKING CARD ── */
.booking-card{
  background:var(--white);
  border:1.5px solid var(--sand-dark);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 4px 20px rgba(58,47,40,.08);
}
.booking-card-header{
  background:var(--moss-pale);
  padding:var(--space-5) var(--space-6);
  border-bottom:1px solid var(--sand-dark);
  text-align:center;
}
.booking-card-header .price-label{
  font-size:.7rem;font-weight:600;text-transform:uppercase;
  letter-spacing:.08em;color:var(--moss);margin-bottom:var(--space-1);
}
.booking-card-header .price{
  font-family:var(--font-display);
  font-size:2rem;color:var(--moss);
}
.booking-card-header .price-child{
  font-size:.82rem;color:var(--bark-light);margin-top:.15rem;
}
.booking-card-header .price-saving{
  display:inline-block;
  font-size:.72rem;font-weight:700;color:#fff;
  background:var(--carmine);
  padding:var(--space-1) .7rem;border-radius:4px;
  margin-top:var(--space-2);
  letter-spacing:.02em;
}
.booking-card-body{padding:var(--space-5) var(--space-6)}
.booking-card-body .btn{
  display:flex;align-items:center;justify-content:center;gap:var(--space-2);
  width:100%;
  padding:.85rem var(--space-6);border-radius:8px;
  font-family:var(--font-body);
  font-size:.9rem;font-weight:600;
  cursor:pointer;transition:all .25s;
  text-decoration:none;border:none;
}
.btn-enquire{
  background:var(--moss);color:var(--white);
  box-shadow:0 2px 8px rgba(90,114,71,.25);
  margin-bottom:var(--space-3);
}
.btn-enquire:hover{background:var(--moss-light);color:var(--white);transform:translateY(-1px)}
.btn-reserve{
  background:transparent;color:var(--bark);
  border:1.5px solid var(--sand-dark);
}
.btn-reserve:hover{border-color:var(--moss);color:var(--moss)}
.btn svg{width:18px;height:18px}
.booking-card-details{
  padding:var(--space-4) var(--space-6);
  border-top:1px solid var(--sand);
  font-size:.82rem;color:var(--bark-light);
  line-height:1.6;
}
.booking-card-details ul{list-style:none;padding:0}
.booking-card-details li{
  display:flex;align-items:flex-start;gap:.4rem;
  margin-bottom:.35rem;
}
.booking-card-details li svg{flex-shrink:0;width:14px;height:14px;color:var(--moss);margin-top:2px}
.booking-card-compare{
  padding:var(--space-3) var(--space-6) var(--space-5);
  text-align:center;
  font-size:.78rem;color:var(--bark-light);
}
.booking-card-compare a{color:var(--moss);text-decoration:underline}

/* ── BOOKING CARD ZERO-PAY STRIP ── */
.bk-zero-strip{
  background:linear-gradient(135deg,#EADFC4 0%,#E6DDC8 100%);
  border-bottom:1px solid var(--bronze);
  padding:.7rem var(--space-5);
  text-align:center;
}
.bk-zero-strip-main{
  font-size:.82rem;font-weight:700;color:var(--peat);
  display:flex;align-items:center;justify-content:center;gap:.4rem;
  margin-bottom:.35rem;
}
.bk-zero-strip-main svg{flex-shrink:0;color:var(--carmine)}
.bk-zero-strip-steps{
  display:flex;flex-wrap:wrap;justify-content:center;gap:.3rem .85rem;
}
.bk-zero-step{
  font-size:.72rem;color:var(--bark-light);
  display:flex;align-items:center;gap:var(--space-1);
}
.bk-zero-step::before{content:'';width:4px;height:4px;border-radius:50%;background:var(--carmine);flex-shrink:0}

/* ── CTA BOX (inline) — Latgale shawl palette: flax + carmine + indigo ── */
.cta-box{
  background:#E6DDC8;
  border:1px solid var(--bronze);
  border-left:4px solid var(--carmine);
  border-radius:8px 14px 14px 8px;
  padding:var(--space-8);
  margin:var(--space-10) 0;
  text-align:center;
}
.cta-box h3{color:var(--indigo);margin-top:0;margin-bottom:var(--space-2);font-size:1.25rem;border-left:none;padding-left:0}
.cta-box p{margin-bottom:var(--space-5);color:var(--peat);font-size:.92rem}
.cta-box .btn{
  display:inline-flex;align-items:center;gap:var(--space-2);
  padding:var(--space-3) 1.75rem;background:var(--carmine);color:var(--white);
  border-radius:8px;font-weight:600;font-size:.9rem;
  text-decoration:none;transition:all .25s;border:none;cursor:pointer;
  box-shadow:0 2px 8px rgba(158,27,50,.2);
}
.cta-box .btn:hover{background:var(--carmine-dark);color:var(--white);transform:translateY(-1px)}

/* ── RELATED READING ── */
.related-reading{
  background:var(--sand);
  border-radius:14px;
  padding:var(--space-8);
  margin-top:var(--space-12);
}
.related-reading h3{font-size:1.15rem;margin-bottom:var(--space-4)}
.related-links{display:flex;flex-direction:column;gap:.6rem}
.related-link{
  display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-3) var(--space-4);
  background:var(--white);
  border:1px solid var(--sand-dark);
  border-radius:8px;
  text-decoration:none;
  transition:all .2s;
}
.related-link:hover{border-color:var(--indigo);box-shadow:0 2px 8px rgba(37,57,97,.12)}
.related-link svg{flex-shrink:0;width:18px;height:18px;color:var(--indigo)}
.related-link span{font-size:.88rem;color:var(--bark);font-weight:500}

/* ── TRUST STRIP ── */
.trust-strip{
  display:flex;flex-wrap:wrap;gap:var(--space-6);
  justify-content:center;align-items:center;
  padding:var(--space-8);
  margin:var(--space-12) 0 0;
  border-top:1px solid var(--sand-dark);
  font-size:.8rem;color:var(--bark-light);
}
.trust-strip-item{
  display:flex;align-items:center;gap:var(--space-2);
}
.trust-strip-item svg{width:18px;height:18px;color:var(--moss)}

/* ── BOOKING SECTION ── */
.booking-section{
  max-width:1100px;margin:0 auto;
  padding:0 var(--space-8) var(--space-8);
}
.booking-section h2{font-size:1.6rem;margin-bottom:var(--space-6);text-align:center}
.pricing-compare{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-4);
  margin-bottom:var(--space-8);
}
.price-option{
  border:1.5px solid var(--sand-dark);border-radius:12px;
  padding:var(--space-5);text-align:center;position:relative;
  transition:all .25s;
}
.price-option.direct{border-color:var(--moss);background:var(--moss-pale)}
.price-option.direct .price-badge{
  position:absolute;top:-10px;left:50%;transform:translateX(-50%);
  background:var(--moss);color:white;
  font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:var(--space-1) var(--space-3);border-radius:20px;white-space:nowrap;
}
.price-option h5{font-size:.8rem;font-weight:600;color:var(--bark-light);margin-bottom:var(--space-2)}
.price-amounts{margin-bottom:var(--space-3)}
.price-main{font-family:var(--font-display);font-size:1.6rem;color:var(--bark)}
.price-option.direct .price-main{color:var(--moss);font-size:1.8rem}
.price-child{font-size:.82rem;color:var(--bark-light);margin-top:.15rem}
.price-ota .price-main{color:var(--bark-light)}
.price-saving{
  display:inline-block;font-size:.72rem;font-weight:700;color:#fff;
  background:var(--carmine);padding:var(--space-1) .7rem;border-radius:4px;margin-bottom:var(--space-3);letter-spacing:.02em;
}
.price-option .btn-book{
  display:flex;align-items:center;justify-content:center;gap:var(--space-2);
  width:100%;padding:.7rem;border-radius:8px;
  font-family:var(--font-body);
  font-size:.85rem;font-weight:600;cursor:pointer;
  transition:all .25s;text-decoration:none;border:none;
}
.btn-book-primary{background:var(--moss);color:var(--white);box-shadow:0 2px 8px rgba(90,114,71,.25)}
.btn-book-primary:hover{background:var(--moss-light);color:var(--white)}
.btn-book-outline{background:transparent;color:var(--bark);border:1.5px solid var(--sand-dark)}
.btn-book-outline:hover{border-color:var(--moss);color:var(--moss)}
.price-note{font-size:.8rem;color:var(--bark-light);font-style:italic;text-align:center;margin-bottom:var(--space-8)}

/* Booking form */
.bf-card{
  background:var(--white);border:1.5px solid var(--sand-dark);border-radius:14px;
  overflow:hidden;box-shadow:0 4px 20px rgba(58,47,40,.06);
  max-width:680px;margin:0 auto;
  display:none;
  scroll-margin-top:90px;
}
.bf-card.open{display:block;animation:fadeInUp .4s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.bf-card-header{position:relative}
.bf-close-btn{position:absolute;top:.75rem;right:.75rem;background:none;border:none;cursor:pointer;color:var(--bark-light);padding:var(--space-1);border-radius:4px;display:flex;align-items:center;justify-content:center;transition:color .2s,background .2s}
.bf-close-btn:hover{color:var(--bark);background:var(--sand)}
.bf-card-header{
  background:var(--moss-pale);padding:var(--space-5) var(--space-6);
  border-bottom:1px solid var(--sand-dark);text-align:center;
}
.bf-card-header h3{font-size:1.1rem;color:var(--moss);margin-bottom:var(--space-1)}
.bf-card-header p{font-size:.85rem;color:var(--bark-light);margin:0}
.bf-card-body{padding:var(--space-6)}
.bf-field{margin-bottom:var(--space-4)}
.bf-field label{
  display:block;font-size:.78rem;font-weight:600;color:var(--bark-light);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:.35rem;
}
.bf-field input,.bf-field select,.bf-field textarea{
  width:100%;padding:.65rem .85rem;
  border:1.5px solid var(--sand-dark);border-radius:8px;
  font-family:inherit;font-size:.9rem;color:var(--bark);
  background:var(--white);transition:border-color .2s;
}
.bf-field input:focus,.bf-field select:focus,.bf-field textarea:focus{
  outline:none;border-color:var(--moss);
}
.bf-field textarea{resize:vertical;min-height:70px}
.bf-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
.bf-actions{display:flex;gap:var(--space-3);margin-top:var(--space-3);flex-wrap:wrap}
.bf-actions .btn{
  flex:1;min-width:160px;justify-content:center;
  display:flex;align-items:center;gap:var(--space-2);
  padding:.8rem var(--space-6);border-radius:8px;
  font-family:var(--font-body);
  font-size:.88rem;font-weight:600;cursor:pointer;
  transition:all .25s;text-decoration:none;border:none;
}
.bf-whatsapp{background:#25D366;color:var(--white)}
.bf-whatsapp:hover{background:#1da851;color:var(--white)}
.bf-email{background:var(--moss);color:var(--white)}
.bf-email:hover{background:var(--moss-light);color:var(--white)}
.bf-note{margin-top:var(--space-4);font-size:.78rem;color:var(--bark-light);text-align:center;line-height:1.5}

/* ── TALK TO DAIGA CARD ── */
.daiga-card{
  background:var(--sand);border-radius:14px;
  padding:var(--space-4) var(--space-5);margin-bottom:var(--space-4);
}
.daiga-card-top{display:flex;align-items:center;gap:.65rem;margin-bottom:.65rem}
.daiga-avatar{width:42px;height:42px;border-radius:50%;overflow:hidden;border:2px solid var(--white);flex-shrink:0}
.daiga-avatar img{width:100%;height:100%;object-fit:cover}
.daiga-card-name{font-size:.88rem;font-weight:600;color:var(--bark);margin-bottom:.1rem}
.daiga-card-sub{font-size:.75rem;color:var(--bark-light);line-height:1.4}
.daiga-btns{display:flex;gap:.4rem;flex-wrap:wrap}
.btn-daiga{
  flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:.35rem;
  padding:.55rem var(--space-2);border-radius:6px;font-size:.78rem;font-weight:600;
  text-decoration:none;cursor:pointer;border:none;transition:all .2s;text-align:center;
  line-height:1.25;
}
.btn-daiga-wa{background:#25D366;color:#fff}
.btn-daiga-wa:hover{background:#1da851;color:#fff}
.btn-daiga-email{background:var(--white);color:var(--bark);border:1px solid var(--sand-dark)}
.btn-daiga-email:hover{border-color:var(--moss);color:var(--moss)}
.btn-daiga svg{width:14px;height:14px;flex-shrink:0}

/* ── BOOKING STEP SYSTEM ── */
.bk-step-header{
  background:var(--moss-pale);padding:var(--space-4) var(--space-5);
  border-bottom:1px solid var(--sand-dark);
}
.bk-price-hero{display:flex;align-items:baseline;gap:var(--space-2);margin-bottom:.15rem}
.bk-price-big{font-family:var(--font-display);font-size:1.9rem;color:var(--moss)}
.bk-price-cross{font-size:.85rem;text-decoration:line-through;color:var(--bark-light)}
.bk-price-save{
  font-size:.68rem;font-weight:700;padding:2px 7px;
  background:var(--white);color:var(--moss);border-radius:4px;
}
.bk-price-sub{font-size:.78rem;color:var(--bark-light)}

.bk-body{padding:1.1rem var(--space-5)}

.bk-step{display:none}
.bk-step.active{display:block}

.bk-step-pill{
  display:inline-flex;align-items:center;gap:5px;
  font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:var(--space-1) .6rem;border-radius:20px;
  background:var(--sand);color:var(--bark-light);
  margin-bottom:var(--space-3);
}
/* ── CLOSE-TO-DEPARTURE WARNING ── */
.bk-close-warning{
  display:flex;align-items:flex-start;gap:var(--space-2);
  font-size:.78rem;color:var(--bark);line-height:1.5;
  padding:.65rem var(--space-3);border-radius:6px;margin-bottom:var(--space-3);
  background:var(--sand);border:1px solid var(--sand-dark);border-left:4px solid var(--amber-light);
}
.bk-close-warning strong{display:block;margin-bottom:.1rem}

/* ── STRIPE SPINNER ── */
.bk-stripe-spinner{
  width:40px;height:40px;border-radius:50%;
  border:3px solid var(--sand-dark);
  border-top-color:var(--moss);
  animation:bk-spin .8s linear infinite;
  margin:0 auto;
}
@keyframes bk-spin{to{transform:rotate(360deg)}}

.bk-step-pill.s-amber{background:var(--amber-light);color:var(--bark)}


.bk-field{margin-bottom:var(--space-3)}
.bk-field label{
  display:block;font-size:.7rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;
  color:var(--bark-light);margin-bottom:.3rem;
}
.bk-input{
  width:100%;padding:.6rem var(--space-3);
  border:1.5px solid var(--sand-dark);border-radius:8px;
  font-family:inherit;font-size:.88rem;color:var(--bark);
  background:var(--white);transition:border-color .2s;
  appearance:auto;
}
.bk-input:focus{outline:none;border-color:var(--moss)}
.bk-input:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-color:var(--moss)}
.bk-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}

.bk-s1-zero-note{
  display:flex;align-items:center;gap:.35rem;
  font-size:.75rem;color:var(--bark-light);
  background:var(--sand);
  border-radius:6px;
  padding:var(--space-2) .65rem;
  margin-bottom:var(--space-2);
  line-height:1.4;
}
.bk-s1-zero-note svg{flex-shrink:0;color:var(--moss);margin-top:1px}

/* Per-excursion booking extras (Kemeri: time slot, swim, shoe sizes, acks).
   (Riga shore: ship name, sailing time, language pref, port-return ack.)
   Hidden by default; revealed only for the excursions that need them. */
.bk-kemeri-extras{display:none}
.booking-card[data-exc="kemeri"] .bk-kemeri-extras,
.booking-card[data-exc="riga-shore"] .bk-rigashore-extras{
  display:block;
  margin:var(--space-3) 0 var(--space-2);
  padding:var(--space-3) .85rem;
  background:var(--sand);
  border-left:3px solid var(--moss);
  border-radius:6px;
}
.bk-kemeri-extras .bk-field{margin-bottom:var(--space-3)}
.bk-kemeri-extras .bk-field:last-of-type{margin-bottom:var(--space-2)}
.bk-kemeri-hint{
  font-size:.7rem;color:var(--bark-light);
  margin-top:.3rem;line-height:1.45;
}
.bk-kemeri-ack{
  margin-top:var(--space-2);padding-top:var(--space-2);
  border-top:1px solid rgba(105,82,55,.18);
}
.bk-kemeri-checkrow{
  display:flex;align-items:flex-start;gap:.55rem;
  font-size:.74rem;color:var(--bark);line-height:1.45;
  cursor:pointer;margin-bottom:.55rem;
}
.bk-kemeri-checkrow:last-child{margin-bottom:0}
.bk-kemeri-checkrow input[type="checkbox"]{
  margin:.18em 0 0 0;flex-shrink:0;accent-color:var(--moss);
  width:1rem;height:1rem;
}

.bk-avail-hint{
  font-size:.75rem;color:var(--bark-light);
  padding:var(--space-2) .6rem;background:var(--sand);
  border-radius:6px;margin-bottom:var(--space-3);line-height:1.5;
  transition:background .2s, color .2s;
}
.bk-avail-hint a{color:var(--moss);font-weight:600;text-decoration:underline}
.bk-avail-hint.avail-ok{
  background:var(--moss-pale);color:var(--moss);font-weight:600;
  border:1px solid rgba(90,114,71,.25);
}
.bk-avail-hint.avail-warn{
  background:var(--sand);color:var(--bark);font-weight:600;
  border:1px solid var(--sand-dark);border-left:4px solid var(--amber-light);
}
.bk-avail-hint.avail-bad{
  background:#fdf2f2;color:var(--clay);font-weight:600;
  border:1px solid rgba(184,112,90,.25);
}

.bk-btn-primary{
  width:100%;padding:.8rem;border:none;border-radius:8px;
  background:var(--moss);color:var(--white);
  font-family:inherit;font-size:.9rem;font-weight:600;
  cursor:pointer;transition:all .2s;display:flex;
  align-items:center;justify-content:center;gap:.4rem;
  margin-bottom:var(--space-2);box-shadow:0 2px 8px rgba(90,114,71,.2);
}
.bk-btn-primary:hover{background:var(--moss-light);transform:translateY(-1px)}
.bk-btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.bk-btn-secondary{
  width:100%;padding:.65rem;border:1.5px solid var(--sand-dark);
  border-radius:8px;background:transparent;
  font-family:inherit;font-size:.82rem;font-weight:600;
  color:var(--bark-light);cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.bk-btn-secondary:hover{border-color:var(--moss);color:var(--moss)}
.bk-btn-wa{
  width:100%;padding:.8rem;border:none;border-radius:8px;
  background:#25D366;color:#fff;
  font-family:inherit;font-size:.88rem;font-weight:600;
  cursor:pointer;transition:opacity .2s;display:flex;
  align-items:center;justify-content:center;gap:.4rem;
  margin-bottom:.4rem;
}
.bk-btn-wa:hover{opacity:.88}

.bk-divider{
  display:flex;align-items:center;gap:var(--space-2);
  font-size:.72rem;color:var(--bark-light);
  margin:.6rem 0;
}
.bk-divider::before,.bk-divider::after{
  content:'';flex:1;height:1px;background:var(--sand-dark);
}

/* ── DATE SUMMARY CHIP ── */
.bk-date-chip{
  display:flex;align-items:center;gap:.4rem;
  font-size:.82rem;color:var(--bark);font-weight:600;
  background:var(--moss-pale);border-radius:6px;
  padding:.45rem var(--space-3);margin-bottom:var(--space-2);
}
.bk-date-chip svg{width:14px;height:14px;color:var(--moss);flex-shrink:0}
.bk-total-chip{
  display:flex;align-items:center;justify-content:space-between;
  font-size:.82rem;color:var(--bark-light);
  padding:.35rem var(--space-3);margin-bottom:.85rem;
}
.bk-total-chip strong{color:var(--bark);font-size:.95rem}
.bk-price-breakdown{
  padding:.6rem .85rem;margin-bottom:.85rem;
  border:1px solid var(--sand-dark);border-radius:8px;
  background:rgba(255,255,255,.45);
}
.bk-price-row{
  display:grid;grid-template-columns:1fr auto auto;gap:.8rem;
  align-items:baseline;
  font-size:.82rem;color:var(--bark-light);
  padding:.22rem 0;
}
.bk-price-row .bk-pb-unit{font-variant-numeric:tabular-nums;opacity:.75;min-width:3.5em;text-align:right}
.bk-price-row .bk-pb-line{font-variant-numeric:tabular-nums;color:var(--bark);min-width:4em;text-align:right;font-weight:600}
.bk-price-row-total{
  border-top:1px solid var(--sand-dark);
  margin-top:var(--space-1);padding-top:.45rem;
  grid-template-columns:1fr auto;
}
.bk-price-row-total .bk-pb-label strong{color:var(--bark);font-size:.95rem}
.bk-price-row-total .bk-pb-line strong{color:var(--moss);font-size:1.05rem;font-weight:700}
.bk-price-row-today{grid-template-columns:1fr auto;color:var(--bark);font-size:.8rem}
.bk-price-row-today .bk-pb-line{color:var(--moss);font-weight:700}

/* ── PAYMENT OPTIONS ── */
.bk-pay-opts{margin-bottom:.85rem}
.bk-pay-opt{
  border:1.5px solid var(--sand-dark);border-radius:10px;
  padding:.85rem var(--space-4);margin-bottom:.4rem;cursor:pointer;
  position:relative;transition:border-color .15s;
}

/* ── Day-plan fold: collapses stops past dayplan_collapse_after behind a
 *    prominent shimmer-accented "Show all {n} stops" button. Native
 *    <details>, so it works without JS. */
.dayplan-fold{margin:.4rem 0 1rem}
.dayplan-fold > .itin-stop:first-of-type{margin-top:0}
.dayplan-fold-toggle{
  display:inline-flex;align-items:center;gap:.5rem;cursor:pointer;
  background:linear-gradient(135deg, var(--carmine) 0%, #7d1424 100%);
  color:#fff;padding:.65rem 1.5rem;border-radius:999px;
  font-weight:700;font-size:.9rem;letter-spacing:.04em;
  text-transform:uppercase;list-style:none;user-select:none;
  position:relative;overflow:hidden;
  margin:.6rem 0 1.2rem;
  box-shadow:0 4px 14px rgba(158,27,50,.22);
  transition:transform .18s ease, box-shadow .18s ease;
}
.dayplan-fold-toggle::-webkit-details-marker{display:none}
.dayplan-fold-toggle::marker{content:""}
/* Shimmer sweep — soft white gradient that crosses the button every
 * 3.5s. Pauses on hover so it doesn't fight the hover state. Stops
 * once the section is expanded (the user has already engaged). */
.dayplan-fold-toggle::before{
  content:"";position:absolute;top:0;left:-100%;width:75%;height:100%;
  background:linear-gradient(90deg, transparent 0%, rgba(255,255,255,.45) 50%, transparent 100%);
  animation:dayplan-shimmer 3.5s ease-in-out infinite;
  pointer-events:none;
}
@keyframes dayplan-shimmer{
  0%{left:-100%}
  60%, 100%{left:130%}
}
.dayplan-fold-toggle:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(158,27,50,.32);
}
.dayplan-fold-toggle:hover::before{animation-play-state:paused}
.dayplan-fold[open] .dayplan-fold-toggle::before{animation:none;opacity:0}
.dayplan-fold[open] .dayplan-fold-more{display:none}
.dayplan-fold:not([open]) .dayplan-fold-less{display:none}
.dayplan-fold-chev{transition:transform .2s ease}
.dayplan-fold[open] .dayplan-fold-chev{transform:rotate(180deg)}
@media (prefers-reduced-motion: reduce){
  .dayplan-fold-toggle::before{animation:none}
}

/* ── Prose fold (used when main_prose_collapse: true). Native <details>
 *    styled to match the dayplan fold's shimmering pill so the
 *    "Read more" call-to-action reads as a clickable affordance, not
 *    just an underlined link. */
.prose-fold{margin:.2rem 0 1.2rem}
.prose-fold > p:first-of-type{margin-top:.4rem}
.prose-fold-toggle{
  display:inline-flex;align-items:center;gap:.5rem;cursor:pointer;
  background:linear-gradient(135deg, var(--carmine) 0%, #7d1424 100%);
  color:#fff;padding:.6rem 1.4rem;border-radius:999px;
  font-weight:700;font-size:.85rem;letter-spacing:.04em;
  text-transform:uppercase;list-style:none;user-select:none;
  position:relative;overflow:hidden;
  margin:.8rem 0 .6rem;
  box-shadow:0 4px 12px rgba(158,27,50,.2);
  transition:transform .18s ease, box-shadow .18s ease;
}
.prose-fold-toggle::-webkit-details-marker{display:none}
.prose-fold-toggle::marker{content:""}
.prose-fold-toggle::before{
  content:"";position:absolute;top:0;left:-100%;width:75%;height:100%;
  background:linear-gradient(90deg, transparent 0%, rgba(255,255,255,.45) 50%, transparent 100%);
  animation:dayplan-shimmer 3.5s ease-in-out infinite;
  pointer-events:none;
}
.prose-fold-toggle:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 16px rgba(158,27,50,.3);
  color:#fff;text-decoration:none;
}
.prose-fold-toggle:hover::before{animation-play-state:paused}
.prose-fold[open] .prose-fold-toggle::before{animation:none;opacity:0}
.prose-fold[open] .prose-fold-more{display:none}
.prose-fold:not([open]) .prose-fold-less{display:none}
.prose-fold-chev{transition:transform .2s ease}
.prose-fold[open] .prose-fold-chev{transform:rotate(180deg)}

/* Rail layout */
.reviews-rail-wrap{position:relative;margin:0 calc(var(--space-8) * -1)}
.reviews-rail{display:flex;gap:var(--space-5);overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scroll-padding:0 var(--space-8);padding:var(--space-2) var(--space-8) var(--space-6);scrollbar-width:thin;scrollbar-color:var(--moss) transparent}
.reviews-rail::-webkit-scrollbar{height:8px}
.reviews-rail::-webkit-scrollbar-track{background:transparent}
.reviews-rail::-webkit-scrollbar-thumb{background:var(--sand-dark);border-radius:4px}
.reviews-rail::-webkit-scrollbar-thumb:hover{background:var(--moss)}
.reviews-rail .review-card{flex:0 0 340px;max-width:340px;scroll-snap-align:start;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.reviews-rail .review-text{flex:1;display:-webkit-box;-webkit-line-clamp:10;-webkit-box-orient:vertical;overflow:hidden}
.reviews-rail .review-card.expanded .review-text{display:block;-webkit-line-clamp:unset;overflow:visible}
.reviews-rail .review-card-toggle{background:none;border:0;padding:0;margin-top:var(--space-2);font-size:.78rem;color:var(--moss);cursor:pointer;text-decoration:underline;align-self:flex-start;font-family:inherit}
.reviews-rail-fade{pointer-events:none;position:absolute;top:0;bottom:0;width:48px;z-index:2}
.reviews-rail-fade.left{left:0;background:linear-gradient(to right,var(--white),transparent)}
.reviews-rail-fade.right{right:0;background:linear-gradient(to left,var(--white),transparent)}
.reviews-rail-fade.hidden{opacity:0;transition:opacity .2s}
.review-lang-tag{display:inline-block;font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;color:var(--bark-light);background:var(--cream);border:1px solid var(--sand-dark);border-radius:4px;padding:2px 6px;margin-bottom:var(--space-2)}
/* Inline variant: rail sits inside .content-main between prose and itinerary.
   No banded background, no centred header — heading inherits .content-main h2
   styling (star icon prefix, bark colour). The negative-margin trick from the
   homepage wrap is neutralised so the rail respects the column width.

   IMPORTANT: .content-main is a CSS Grid item (1fr column). By default grid
   items have min-width:auto, which means fixed-width descendants (our 260px
   rail cards) push the grid track wider than 1fr and blow out the whole
   2-column layout. Setting min-width:0 on the grid item is the standard fix
   — it lets the column stay 1fr and forces the rail to respect the column
   width with overflow-x scrolling. */
.content-main{min-width:0}
.reviews-inline{margin:var(--space-8) 0;scroll-margin-top:120px;min-width:0}
.reviews-inline > h2{margin-top:0}
.reviews-inline .reviews-rail-wrap{position:relative;margin:0;background:transparent;min-width:0;overflow:hidden}
.reviews-inline .reviews-rail{padding:var(--space-2) 0 var(--space-4) 0;scroll-padding:0;gap:var(--space-4)}
/* Smaller cards in the column-constrained layout so 2-2.5 fit comfortably
   and users can see the next card peek through, signalling "more here". */
.reviews-inline .reviews-rail .review-card{flex:0 0 260px;max-width:260px;padding:var(--space-5)}
.reviews-inline .reviews-rail .review-text{font-size:.84rem;-webkit-line-clamp:8}
.reviews-inline .reviews-rail-fade.left{background:linear-gradient(to right,var(--linen) 30%,transparent)}
.reviews-inline .reviews-rail-fade.right{background:linear-gradient(to left,var(--linen) 30%,transparent)}
.reviews-inline .reviews-rail-fade{width:56px}
/* Footer row: count hint on the left, prev/next arrows on the right. */
.reviews-inline-footer{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:var(--space-2);gap:var(--space-3);
  font-size:.78rem;color:var(--bark-light);
}
.reviews-inline-count{font-style:italic}
.reviews-rail-nav{display:flex;gap:var(--space-2)}
.reviews-rail-nav button{
  width:34px;height:34px;border-radius:50%;
  border:1px solid var(--sand-dark);background:var(--white);
  color:var(--moss);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-family:inherit;font-size:1rem;line-height:1;
  transition:background .15s,border-color .15s,opacity .15s;
}
.reviews-rail-nav button:hover{background:var(--sand);border-color:var(--moss)}
.reviews-rail-nav button:disabled{opacity:.35;cursor:default}
.reviews-rail-nav button:disabled:hover{background:var(--white);border-color:var(--sand-dark)}
.reviews-rail-nav svg{width:16px;height:16px}
@media(max-width:768px){
  .reviews{padding:2.5rem var(--space-5)}
  .reviews-rail-wrap{margin:0 calc(var(--space-5) * -1)}
  .reviews-rail{padding:var(--space-2) var(--space-5) var(--space-6);scroll-padding:0 var(--space-5)}
  .reviews-rail .review-card{flex:0 0 86vw;max-width:86vw}
  .reviews-rail-fade{width:24px}
  .reviews-inline .reviews-rail-wrap{margin:0 calc(var(--space-5) * -1)}
  .reviews-inline .reviews-rail{padding:var(--space-2) var(--space-5) var(--space-4);scroll-padding:0 var(--space-5)}
  .reviews-inline .reviews-rail .review-card{flex:0 0 86vw;max-width:86vw}
  /* Hide arrow buttons on touch — swipe is the natural affordance */
  .reviews-rail-nav{display:none}
}

/* Top "Highlighted reviews" rail (mirrors GetYourGuide's near-the-top
   short-review block). Sits between the hero and the two-column body. */
.top-reviews{background:var(--linen);border-top:1px solid var(--sand-dark);border-bottom:1px solid var(--sand-dark);padding:var(--space-7) 0}
.top-reviews-inner{max-width:1100px;margin:0 auto;padding:0 var(--space-8)}
.top-reviews-h3{margin:0 0 var(--space-2);font-size:1.15rem;color:var(--bark);letter-spacing:-0.005em}
.top-reviews-sub{margin:0 0 var(--space-4);font-size:.82rem;color:var(--bark-light);font-style:italic}
.top-reviews .reviews-rail-wrap{margin:0 calc(var(--space-8) * -1)}
.top-reviews .reviews-rail{padding:var(--space-2) var(--space-8) var(--space-4)}
.top-reviews .reviews-rail .review-card{flex:0 0 360px;max-width:360px;background:var(--white);border:1px solid var(--sand-dark)}
.top-reviews .reviews-rail .review-text{-webkit-line-clamp:8}
@media (max-width:780px){
  .top-reviews{padding:var(--space-6) 0}
  .top-reviews-inner{padding:0 var(--space-5)}
  .top-reviews .reviews-rail-wrap{margin:0 calc(var(--space-5) * -1)}
  .top-reviews .reviews-rail{padding:var(--space-2) var(--space-5) var(--space-4);scroll-padding:0 var(--space-5)}
  .top-reviews .reviews-rail .review-card{flex:0 0 86vw;max-width:86vw}
}

/* Inline reviews summary row (overall rating · "Based on N reviews" line
   above the bottom-of-page review rail). */
.reviews-inline-sub{margin:0 0 var(--space-4);font-size:.82rem;color:var(--bark-light);font-style:italic}
.reviews-inline-summary{display:flex;align-items:baseline;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-4);padding-bottom:var(--space-3);border-bottom:1px solid var(--sand-dark)}
.reviews-inline-label{font-size:.78rem;color:var(--bark-light);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.reviews-inline-rating{font-size:1.4rem;color:var(--amber);font-weight:700}
.reviews-inline-count{font-size:.85rem;color:var(--bark-light);font-style:italic}
/* BB_EXC_REVIEWS_CSS_END */
/* BB_SIDEBAR_FIX_START */
/* Restore natural document flow for the booking-widget sidebar so the page
   scrolls as one piece, no inner scrollbar, no sticky pinning. Injected by
   inject_reviews.py per Madhu's request. */
.content-grid > .content-sidebar,
.content-sidebar{
  position:static;
  top:auto;
  max-height:none;
  overflow:visible;
  padding-right:0;
}
/* BB_SIDEBAR_FIX_END */
</style>
